<!--
  HERO VIDEO — paste into a Custom HTML block that replaces the headshot
  image inside the "hero-image-wrap" group on the Home - New page.

  Replace the five URLs below with the File URLs WordPress gives you after
  uploading the files. Computers and tablets get the wide video; phones
  (700px wide or less) get the tall one. Both use the same captions file.
-->
<figure class="hero-video" data-card-start="25.04"
        data-video-wide="https://edbannon.com/wp-content/uploads/ed-bannon-ad-wide.mp4"
        data-poster-wide="https://edbannon.com/wp-content/uploads/ed-bannon-ad-poster-wide.jpg"
        data-video-tall="https://edbannon.com/wp-content/uploads/ed-bannon-ad-tall.mp4"
        data-poster-tall="https://edbannon.com/wp-content/uploads/ed-bannon-ad-poster-tall.jpg">
  <div class="hero-video__frame">
    <video class="hero-video__media"
           muted playsinline loop preload="none"
           aria-label="Ed Bannon campaign video">
      <track kind="captions" srclang="en" label="English" default src="https://edbannon.com/wp-content/uploads/ed-bannon-ad-captions.vtt">
    </video>
    <div class="hero-video__controls">
      <button type="button" class="hero-video__sound">Sound on</button>
      <button type="button" class="hero-video__pause" aria-label="Pause video"><span aria-hidden="true">❚❚</span></button>
    </div>
  </div>
  <figcaption class="hero-video__caption" aria-live="off"></figcaption>
</figure>

<script>
(function () {
  var fig = document.querySelector('.hero-video');
  if (!fig) return;

  var video = fig.querySelector('video');
  var soundBtn = fig.querySelector('.hero-video__sound');
  var pauseBtn = fig.querySelector('.hero-video__pause');
  var captionBox = fig.querySelector('.hero-video__caption');
  var cardStart = parseFloat(fig.getAttribute('data-card-start')) || 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Pick the tall video for phones and the wide one for everything else.
  // Must match the 700px breakpoint in the CSS.
  var shape = window.matchMedia('(max-width: 700px)').matches ? 'tall' : 'wide';
  video.poster = fig.getAttribute('data-poster-' + shape);
  video.src = fig.getAttribute('data-video-' + shape);
  video.preload = 'auto';

  function setPaused(paused) {
    pauseBtn.innerHTML = paused ? '<span aria-hidden="true">▶</span>' : '<span aria-hidden="true">❚❚</span>';
    pauseBtn.setAttribute('aria-label', paused ? 'Play video' : 'Pause video');
  }

  // Captions: draw the active cue under the video instead of on top of it,
  // so they never cover the ad's own on-screen text.
  var track = video.textTracks && video.textTracks[0];
  var trackEl = video.querySelector('track');
  if (trackEl) {
    trackEl.addEventListener('error', function () { fig.classList.remove('has-captions'); });
  }
  if (track) {
    track.mode = 'hidden';
    fig.classList.add('has-captions');
    track.addEventListener('cuechange', function () {
      var cue = track.activeCues && track.activeCues[0];
      captionBox.textContent = cue ? cue.text : '';
    });
  }

  // Autoplay silently, starting on the "Vote Ed Bannon" card. The loop then
  // wraps around to the beginning of the ad.
  function start() {
    video.currentTime = cardStart;
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () { setPaused(true); }); // autoplay blocked: poster stays up
    }
  }

  if (reduceMotion) {
    setPaused(true);
  } else if (video.readyState >= 1) {
    start();
  } else {
    video.addEventListener('loadedmetadata', start, { once: true });
  }

  // "Sound on" restarts the ad from the top so the full message is heard.
  soundBtn.addEventListener('click', function () {
    if (video.muted) {
      video.muted = false;
      video.currentTime = 0;
      video.play();
      soundBtn.textContent = 'Sound off';
      setPaused(false);
    } else {
      video.muted = true;
      soundBtn.textContent = 'Sound on';
    }
  });

  pauseBtn.addEventListener('click', function () {
    if (video.paused) {
      video.play();
      setPaused(false);
    } else {
      video.pause();
      setPaused(true);
    }
  });
})();
</script>
